#
# The repository's labels. The issue forms and the workflows use these names; they are created over GitHub's API
# when the repository is set up.

- name: "bug"
  color: "d73a4a"
  description: "A reproducible defect"
- name: "enhancement"
  color: "a2eeef"
  description: "A feature request or improvement"
- name: "documentation"
  color: "0075ca"
  description: "README, guides or comments"
- name: "question"
  color: "d876e3"
  description: "A usage question (Discussions is the better place)"
- name: "needs-triage"
  color: "fbca04"
  description: "Waiting for the maintainer"
- name: "needs-info"
  color: "e99695"
  description: "Missing the setup check, the log or the steps to reproduce"
- name: "tracking"
  color: "5319e7"
  description: "Head or controller tracking, sensors"
- name: "picture"
  color: "1d76db"
  description: "Display, Auto-HDR, HDR, motion smoothing"
- name: "steamvr"
  color: "0e8a16"
  description: "The SteamVR driver, games under SteamVR"
- name: "install"
  color: "c5def5"
  description: "Packages, first run, riftlinux-setup"
- name: "upstream"
  color: "cfd3d7"
  description: "A problem in SteamVR, Proton, a graphics driver or Monado, not in RiftLinux"
- name: "duplicate"
  color: "cfd3d7"
  description: "Already reported"
