# Every commit in a pull request must carry a Signed-off-by line (Developer Certificate of Origin 1.1, see
# CONTRIBUTING.md). Lists the commits without it in a comment and fails the check.
name: Sign-off

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  signoff:
    # Only in the main repository, not in forks.
    if: github.repository == 'AIIX/RiftLinux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              ...context.repo, pull_number: pr.number, per_page: 100 });
            const signoff = /^Signed-off-by: .+ <[^>]+@[^>]+>$/im;
            const missing = commits
              .filter(c => !signoff.test(c.commit.message || ""))
              .map(c => ({ sha: c.sha.substring(0, 9), title: (c.commit.message || "").split("\n")[0] }));

            const marker = "<!-- riftlinux-signoff -->";
            const comments = await github.rest.issues.listComments({
              ...context.repo, issue_number: pr.number, per_page: 100 });
            const prev = comments.data.find(c => c.body && c.body.includes(marker));

            if (missing.length) {
              const body = marker + "\n\n" +
                "**Sign-off missing.** Every commit needs a `Signed-off-by:` line ([Developer Certificate of Origin](https://developercertificate.org/), see CONTRIBUTING.md). Use `git commit -s`; to add it to existing commits:\n" +
                "```bash\ngit rebase --exec 'git commit --amend --no-edit -s' origin/main\ngit push --force-with-lease\n```\n\n" +
                "Commits without it:\n" + missing.map(m => `- \`${m.sha}\` ${m.title}`).join("\n");
              if (prev) await github.rest.issues.updateComment({ ...context.repo, comment_id: prev.id, body });
              else await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
              core.setFailed(`${missing.length} commit(s) without Signed-off-by.`);
            } else if (prev) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: prev.id,
                body: marker + "\n\nAll commits are signed off. Thanks." });
            }
