name: Feature request
description: Propose a feature. Open this before writing code.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please open a feature request before writing code ([CONTRIBUTING.md](https://github.com/AIIX/RiftLinux/blob/main/CONTRIBUTING.md#proposing-a-feature)): it may overlap with work in progress, or need a decision first.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What do you want to do with your Rift CV1 that RiftLinux does not let you do today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What you would like
      description: The behaviour you want, as concretely as you can.
    validations:
      required: true

  - type: textarea
    id: windows
    attributes:
      label: How it works on Windows (if it does)
      description: Many requests are about parity with the Oculus runtime; say what it does there.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: RiftLinux's fixed rules (CONTRIBUTING.md, "What we do not take").
      options:
        - label: This is for the Rift CV1 (not another headset).
          required: true
        - label: It needs no setup step from the user and sends no data anywhere unasked.
          required: true
        - label: I searched the existing issues and it has not been proposed.
          required: true
