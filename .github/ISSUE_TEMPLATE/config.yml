# Blank issues are off: every issue goes through a form, so the setup check and the log are always asked for.
blank_issues_enabled: false
contact_links:
  - name: Security problem (do not open a public issue)
    url: https://github.com/AIIX/RiftLinux/blob/main/SECURITY.md
    about: Report security problems privately, as SECURITY.md describes.
  - name: Question or help
    url: https://github.com/AIIX/RiftLinux/discussions
    about: Ask questions in Discussions; issues are for reproducible bugs and feature proposals.
  - name: Known issues
    url: https://github.com/AIIX/RiftLinux#known-issues
    about: Check the README's Known issues before filing a bug.
